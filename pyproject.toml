[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "arenaonair"
version = "0.1.0"
description = "Play-by-play radio-style narration for MTG Arena matches. Announcer first, coaching optional."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = ["websockets>=14,<17"]

[project.optional-dependencies]
watchdog = ["watchdog>=4"]
ui = ["PySide6>=6.6"]
# Kokoro's English phonemizer downloads a spaCy model on first use. Including
# pip makes that download target this interpreter, even in an unactivated uv venv.
tts = ["kokoro>=0.9", "numpy>=1.24", "sounddevice>=0.4", "pip>=24"]
# Hype engine (Chatterbox): high-energy synthesis for high-salience moments.
# Pulls in torch; first run downloads the checkpoint from HF.
tts-chatterbox = ["chatterbox-tts>=0.1", "torch>=2.2"]
dev = ["pytest>=8", "pytest-timeout>=2", "numpy>=1.24"]

[project.scripts]
arenaonair = "arenaonair.app:main"

[project.urls]
Homepage = "https://github.com/josharmour/arenaonair"
Documentation = "https://github.com/josharmour/arenaonair#readme"
Issues = "https://github.com/josharmour/arenaonair/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/arenaonair"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
